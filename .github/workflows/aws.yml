name: AWS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::845061289093:role/github-actions-deploy-role' }}

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dupli1-auth
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE=auth
          - service: dupli1-notification
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE=notification
          - service: dupli1-order
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE=order
          - service: dupli1-product
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE=product
          - service: dupli1-cart
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE=cart
          - service: dupli1-payment
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE=payment
          - service: dupli1-profile
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE=profile
          - service: dupli1-proxy
            dockerfile: api/Dockerfile.ecs
            context: .
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # AmazonEC2ContainerRegistryPowerUser does not include CreateRepository.
      # After terraform apply of github_actions_ecr_create (and/or
      # aws_ecr_repository.profile), describe succeeds or create is allowed.
      - name: Ensure ECR repository exists
        if: github.event_name != 'pull_request'
        env:
          ECR_REPOSITORY: ${{ matrix.service }}
        run: |
          if aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            echo "ECR repository $ECR_REPOSITORY already exists"
          else
            echo "Creating ECR repository $ECR_REPOSITORY"
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: false
          tags: ${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Extract image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - dupli1-auth
          - dupli1-notification
          - dupli1-order
          - dupli1-product
          - dupli1-cart
          - dupli1-payment
          - dupli1-profile
          - dupli1-proxy

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force ECS service redeployment
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ matrix.service }}
        run: |
          echo ECS_CLUSTER: "$ECS_CLUSTER" ECS_SERVICE: "$ECS_SERVICE"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --no-cli-pager
