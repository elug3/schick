name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  auth:
    name: auth
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dupli1
          POSTGRES_PASSWORD: dupli1_dev
          POSTGRES_DB: dupli1_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dupli1 -d dupli1_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://dupli1:dupli1_dev@localhost:5432/dupli1_db?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auth/go.mod

      - name: Test auth module
        working-directory: auth
        run: go test ./... -count=1

