# LOCAL DEVELOPMENT ONLY
# This docker-compose file is intended for local testing.
# Production is deployed to AWS ECS — do not use this file for production.

services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dupli1_db
      POSTGRES_USER: dupli1
      POSTGRES_PASSWORD: dupli1_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dupli1 -d dupli1_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-product:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: dupli1
      POSTGRES_PASSWORD: dupli1_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dupli1 -d products"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-order:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: dupli1
      POSTGRES_PASSWORD: dupli1_dev
    ports:
      - "5435:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dupli1 -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-cart:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cart
      POSTGRES_USER: dupli1
      POSTGRES_PASSWORD: dupli1_dev
    ports:
      - "5436:5432"
    volumes:
      - postgres-cart-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dupli1 -d cart"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payment:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: dupli1
      POSTGRES_PASSWORD: dupli1_dev
    ports:
      - "5437:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dupli1 -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-notification:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: dupli1
      POSTGRES_PASSWORD: dupli1_dev
    ports:
      - "5438:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dupli1 -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-profile:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profiles
      POSTGRES_USER: dupli1
      POSTGRES_PASSWORD: dupli1_dev
    ports:
      - "5439:5432"
    volumes:
      - postgres-profile-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dupli1 -d profiles"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "--auth", "${NATS_TOKEN:-dupli1_nats_dev}"]
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dupli1}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dupli1_dev}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-dupli1} ${MINIO_SECRET_KEY:-dupli1_dev} &&
        mc mb --ignore-existing local/product-images &&
        mc anonymous set download local/product-images
      "
    restart: "no"

  dupli1-auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    ports:
      - "18080:8080"
    environment:
      DB_URL: postgres://dupli1:dupli1_dev@postgres-auth:5432/dupli1_db?sslmode=disable
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:-dupli1_nats_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production}
      DUPLI1_AUTH_ADDR: :8080
      AUTH_OPEN_REGISTER: "true"
      OWNER_EMAIL: admin@dupli1.com
      OWNER_PASSWORD: password
      DUPLI1_WEB_SERVICE_EMAIL: dupli1-web@web.dupli1.com
      DUPLI1_WEB_SERVICE_PASSWORD: dupli1-web-dev-secret
      DUPLI1_ORDER_SERVICE_EMAIL: dupli1-order@order.dupli1.com
      DUPLI1_ORDER_SERVICE_PASSWORD: dupli1-order-dev-secret
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  dupli1-product:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: product
    ports:
      - "8081:8080"
    environment:
      DUPLI1_PRODUCT_DB: postgres://dupli1:dupli1_dev@postgres-product:5432/products?sslmode=disable
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production}
      AUTH_JWKS_URL: http://dupli1-auth:8080/api/v1/auth/.well-known/jwks.json
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:-dupli1_nats_dev}
      S3_ENDPOINT: http://minio:9000
      # MinIO's Docker-network hostname isn't resolvable by browsers, so image
      # URLs returned to clients route through the nginx gateway (dupli1-proxy)
      # /product-images/ → MinIO. Include the bucket path prefix in the public
      # base (Upload appends /{objectKey} only). See docs/product-images-browser-access.md.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8080/product-images}
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dupli1}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-dupli1_dev}
      S3_BUCKET: product-images
    depends_on:
      postgres-product:
        condition: service_healthy
      dupli1-auth:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/products/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  dupli1-order:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order
    ports:
      - "8083:8080"
    environment:
      DUPLI1_ORDER_ADDR: :8080
      # Stock/coupons go through the internal nginx gateway (not direct product DNS).
      DUPLI1_GATEWAY_URL: http://dupli1-proxy
      # Auth login stays direct so bootstrap does not wait on the proxy
      # (proxy depends_on order health — would deadlock if auth went via gateway at startup).
      DUPLI1_AUTH_URL: http://dupli1-auth:8080
      DUPLI1_ORDER_SERVICE_EMAIL: dupli1-order@order.dupli1.com
      DUPLI1_ORDER_SERVICE_PASSWORD: dupli1-order-dev-secret
      DUPLI1_ORDER_DB: postgres://dupli1:dupli1_dev@postgres-order:5432/orders?sslmode=disable
      # Flat per-order delivery charge in whole KRW. Unset/0 means free delivery.
      DUPLI1_ORDER_SHIPPING_FEE_CENTS: ${DUPLI1_ORDER_SHIPPING_FEE_CENTS:-30000}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production}
      AUTH_JWKS_URL: http://dupli1-auth:8080/api/v1/auth/.well-known/jwks.json
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:-dupli1_nats_dev}
    depends_on:
      postgres-order:
        condition: service_healthy
      dupli1-auth:
        condition: service_healthy
      nats:
        condition: service_healthy
    # Gateway is used at runtime for stock/coupons; do not depends_on dupli1-proxy
    # (proxy already depends_on order — circular).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  dupli1-cart:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: cart
    ports:
      - "8086:8080"
    environment:
      DUPLI1_CART_ADDR: :8080
      DUPLI1_CART_DB: postgres://dupli1:dupli1_dev@postgres-cart:5432/cart?sslmode=disable
      DUPLI1_PRODUCT_URL: http://dupli1-product:8080
      # Inventory (stock/reservations) is served by product now.
      DUPLI1_INVENTORY_URL: http://dupli1-product:8080
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production}
      AUTH_JWKS_URL: http://dupli1-auth:8080/api/v1/auth/.well-known/jwks.json
    depends_on:
      postgres-cart:
        condition: service_healthy
      dupli1-auth:
        condition: service_healthy
      dupli1-product:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  dupli1-payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment
    ports:
      - "8087:8080"
    environment:
      DUPLI1_PAYMENT_ADDR: :8080
      DUPLI1_PAYMENT_DB: postgres://dupli1:dupli1_dev@postgres-payment:5432/payments?sslmode=disable
      DUPLI1_ORDER_URL: http://dupli1-order:8080
      DUPLI1_PAYMENT_PUBLIC_URL: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production}
      AUTH_JWKS_URL: http://dupli1-auth:8080/api/v1/auth/.well-known/jwks.json
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:-dupli1_nats_dev}
      # NANO Solution certified card PG (optional). When set, credit_card uses NANO;
      # otherwise credit_card is unavailable and card testing uses method=bypass instead.
      # Test creds from NANO API guide; production uses Secrets Manager.
      NANO_BASE_URL: ${NANO_BASE_URL:-}
      NANO_VER: ${NANO_VER:-}
      NANO_SHOPCODE: ${NANO_SHOPCODE:-}
      NANO_LOGIN_ID: ${NANO_LOGIN_ID:-}
      NANO_API_KEY: ${NANO_API_KEY:-}
      NANO_SUCCESS_URL: ${NANO_SUCCESS_URL:-http://localhost:5173/checkout/confirmation}
      NANO_FAILURE_URL: ${NANO_FAILURE_URL:-http://localhost:5173/checkout}
    depends_on:
      postgres-payment:
        condition: service_healthy
      dupli1-auth:
        condition: service_healthy
      dupli1-order:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  dupli1-notification:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification
    ports:
      - "8084:8080"
    environment:
      DUPLI1_NOTIFICATION_ADDR: :8080
      DUPLI1_NOTIFICATION_DB: postgres://dupli1:dupli1_dev@postgres-notification:5432/notifications?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:-dupli1_nats_dev}
      AUTH_JWKS_URL: http://dupli1-auth:8080/api/v1/auth/.well-known/jwks.json
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_ORDER_CHAT_ID: ${TELEGRAM_ORDER_CHAT_ID:-}
      TELEGRAM_PRODUCT_CHAT_ID: ${TELEGRAM_PRODUCT_CHAT_ID:-}
      MANAGE_WEB_URL: ${MANAGE_WEB_URL:-https://manage.dupli1.com}
    depends_on:
      postgres-notification:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  dupli1-profile:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: profile
    ports:
      - "8088:8080"
    environment:
      DUPLI1_PROFILE_ADDR: :8080
      DUPLI1_PROFILE_DB: postgres://dupli1:dupli1_dev@postgres-profile:5432/profiles?sslmode=disable
      AUTH_JWKS_URL: http://dupli1-auth:8080/api/v1/auth/.well-known/jwks.json
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-do-not-use-in-production}
      NATS_URL: nats://nats:4222
      NATS_TOKEN: ${NATS_TOKEN:-dupli1_nats_dev}
    depends_on:
      postgres-profile:
        condition: service_healthy
      dupli1-auth:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  dupli1-proxy:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8080:80"
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      dupli1-auth:
        condition: service_healthy
      dupli1-product:
        condition: service_healthy
      dupli1-order:
        condition: service_healthy
      dupli1-cart:
        condition: service_healthy
      dupli1-payment:
        condition: service_healthy
      dupli1-profile:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-auth-data:
  postgres-product-data:
  postgres-order-data:
  postgres-cart-data:
  postgres-payment-data:
  postgres-notification-data:
  postgres-profile-data:
  minio-data:
